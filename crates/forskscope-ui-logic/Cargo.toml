[package]
name        = "forskscope-ui-logic"
description = "Framework-independent presentation logic for ForskScope (view-model layer; no GUI dependency, fully testable without a display server)."
readme      = "../../README.md"

version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
forskscope-core             = { path = "../forskscope-core" }

[target.'cfg(unix)'.dev-dependencies]
# F143: lets permission-guard tests (explore/deep_filter.rs,
# explore/classify_pair.rs) tell "running as root" (a known, deliberate
# reason a chmod-based guard has no effect) from anything else, which must
# fail loudly instead of skip - same reviewed use as forskscope-core's own
# cfg(unix) dev-dependency.
libc                         = { workspace = true }
