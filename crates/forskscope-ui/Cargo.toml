[package]
name        = "forskscope-ui"
description = "ForskScope desktop UI: app shell, explorer, compare/diff-merge workspace, settings, dialogs."
readme      = "../../README.md"

version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[[bin]]
name = "forskscope"
path = "src/main.rs"

[lib]
name = "forskscope_ui"
path = "src/lib.rs"

[dependencies]
forskscope-core             = { workspace = true }
forskscope-ui-logic         = { workspace = true }

dioxus                      = { workspace = true }
dioxus-core                 = { workspace = true }
dioxus-desktop              = { workspace = true }
dioxus-swdir-tree           = { workspace = true }
wry                         = { workspace = true }

app-json-settings           = { workspace = true }
dirs-next                   = { workspace = true }
native-tls                  = { workspace = true }
rfd                         = { workspace = true }

serde                       = { workspace = true }
serde_json                  = { workspace = true }
tokio                       = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# F143: lets permission-guard tests (explorer.rs, state/compare/tests.rs)
# tell "running as root" (a known, deliberate reason a chmod-based guard has
# no effect) from anything else, which must fail loudly instead of skip -
# same reviewed use as forskscope-core's own cfg(unix) dev-dependency.
libc                         = { workspace = true }
