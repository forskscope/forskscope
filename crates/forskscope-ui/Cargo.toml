[package]
name        = "forskscope-ui"
description = "ForskScope desktop UI: app shell, explorer, compare/diff-merge workspace, settings, dialogs."
readme      = "../../README.md"

version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[[bin]]
name = "forskscope"
path = "src/main.rs"

[lib]
name = "forskscope_ui"
path = "src/lib.rs"

[dependencies]
forskscope-compare           = { workspace = true }
forskscope-core             = { workspace = true }
forskscope-ui-logic         = { workspace = true }

dioxus                      = { workspace = true }
dioxus-core                 = { workspace = true }
dioxus-desktop              = { workspace = true }
dioxus-swdir-tree           = { workspace = true }
wry                         = { workspace = true }

app-json-settings           = { workspace = true }
# RFC-092 (handoff 084): already resolved transitively (forskscope-core);
# first direct, declared use is the comparison-report export dialog's
# "generated at" timestamp (local time with its UTC offset).
chrono                       = { workspace = true }
dirs-next                   = { workspace = true }
# RFC-091 §3: `atexit`, to remove Private mode's temporary web-view folder
# even though `dioxus_desktop::launch::launch` never returns to `main` — see
# `startup_mode::configure_webview_data_dir`'s doc comment. Also used,
# `cfg(unix)` only, by the F143 permission-guard tests (explorer.rs,
# state/compare/tests.rs) to tell "running as root" (a known, deliberate
# reason a chmod-based guard has no effect) from anything else, which must
# fail loudly instead of skip — one dependency entry now covers both uses.
libc                         = { workspace = true }
native-tls                  = { workspace = true }
rfd                         = { workspace = true }

serde                       = { workspace = true }
serde_json                  = { workspace = true }
tokio                       = { workspace = true }
