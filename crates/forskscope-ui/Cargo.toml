[package]
# RFC-093 amendment (36eb2a4): the package is named `forskscope`, matching
# the program it builds; the directory stays `crates/forskscope-ui` and the
# library target keeps the name `forskscope_ui` (a library named like the
# `forskscope` program would collide with it in `cargo doc`).
name        = "forskscope"
description = "ForskScope desktop UI: app shell, explorer, compare/diff-merge workspace, settings, dialogs."
readme      = "../../README.md"

version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[[bin]]
name = "forskscope"
path = "src/main.rs"

[lib]
name = "forskscope_ui"
path = "src/lib.rs"

[dependencies]
forskscope-commands          = { workspace = true }
forskscope-compare           = { workspace = true }
forskscope-desktop           = { workspace = true }
forskscope-edit             = { workspace = true }
forskscope-report           = { workspace = true }
forskscope-ui-logic         = { workspace = true }

dioxus                      = { workspace = true }
dioxus-core                 = { workspace = true }
dioxus-desktop              = { workspace = true }
dioxus-swdir-tree           = { workspace = true }
wry                         = { workspace = true }

app-json-settings           = { workspace = true }
# RFC-092 (handoff 084): already resolved transitively (forskscope-core,
# since removed by RFC-093 §1 step 7); first direct, declared use is the
# comparison-report export dialog's "generated at" timestamp (local time
# with its UTC offset).
chrono                       = { workspace = true }
dirs-next                   = { workspace = true }
# RFC-091 §3: `atexit`, to remove Private mode's temporary web-view folder
# even though `dioxus_desktop::launch::launch` never returns to `main` — see
# `startup_mode::configure_webview_data_dir`'s doc comment. Also used,
# `cfg(unix)` only, by the F143 permission-guard tests (explorer.rs,
# state/compare/tests.rs) to tell "running as root" (a known, deliberate
# reason a chmod-based guard has no effect) from anything else, which must
# fail loudly instead of skip — one dependency entry now covers both uses.
libc                         = { workspace = true }
native-tls                  = { workspace = true }
rfd                         = { workspace = true }

serde                       = { workspace = true }
serde_json                  = { workspace = true }
tokio                       = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys                  = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
glib                         = { workspace = true }

[dev-dependencies]
# RFC-096: the binary-level `compare`/`mcp` tests moved here from
# forskscope-cli's own tests/ - `tempfile` is their one dev-only need,
# same as it was there.
tempfile                     = { workspace = true }
