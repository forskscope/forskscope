[package]
name        = "forskscope-core"
description = "GUI-independent core for ForskScope: file loading, encoding, diff, merge, save safety, and directory comparison."
readme      = "../../README.md"

version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
encoding_rs                 = { workspace = true }
chardetng                   = { workspace = true }
chrono                      = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
# RFC-085: restores .xlsx structural comparison (RFC-058's suspension is
# lifted at 2.5.0 - see xlsx.rs's module doc for the security/cancellation
# reasoning).
sheets-diff                 = { workspace = true }
similar                     = { workspace = true }
# RFC-077: promoted from dev-dependency for the mergetool save target's
# no-clobber commit (`save::persist_noclobber`), which needs
# `NamedTempFile::persist_noclobber` at runtime, not only in tests.
tempfile                    = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
# F138: caps this process's own address space before opening a crafted CFB
# header, so the regression this guards against (a huge allocation instead of
# a declined file) fails loudly rather than passing unnoticed on a machine
# with room to spare — see tests/f138_decline_before_delegating.rs.
libc                         = { workspace = true }
