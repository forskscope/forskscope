[package]
name        = "forskscope-commands"
description = "forskscope's compare and mcp subcommands (RFC-096): print a comparison, or serve an MCP tool over stdio. Depends only on forskscope-compare and forskscope-report."
readme      = "../../README.md"

version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
forskscope-compare            = { workspace = true }
forskscope-report             = { workspace = true }
# HTML report's `generated_at` timestamp only (RFC-092's own format) -
# already resolved transitively; this is this crate's own direct use.
chrono                        = { workspace = true }
# RFC-094 §4 / review 182 §1: the hand-written mcp server's own JSON-RPC
# framing - already resolved transitively (forskscope-report's own
# versioned JSON contract), and the measured, decided alternative to
# pulling in rmcp's 48 extra crates and async runtime. No new dependency
# to the workspace, only a new edge to one already in it.
serde_json                   = { workspace = true }

[dev-dependencies]
tempfile                    = { workspace = true }
