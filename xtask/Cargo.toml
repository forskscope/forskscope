[package]
name = "xtask"
version = "0.195.1"
edition = "2024"
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

# DEC-005 (F119): xtask stays outside the main Cargo workspace, with its own
# `[workspace]` table and lockfile, so it keeps building and running on its
# own even if the main workspace's root Cargo.toml is broken - the gates
# that check the main workspace (fmt, clippy, tests) need a working `cargo
# xtask` to run them, so xtask being coupled to the thing it verifies would
# make a broken main workspace unable to report that it's broken. Cited
# elsewhere (`.github/workflows/ci.yml`, `ROADMAP.md`) by this name; this is
# the one place the decision itself, not just a reason to remember it, lives.
[workspace]

[dependencies]
# F134: generates the `.xlsx` test fixtures under
# crates/forskscope-compare/src/tests/fixtures/xlsx/ (`cargo xtask xlsx-fixtures`).
# Pinned exactly, not a caret range - this is the one tool whose own version
# the fixtures' README names, so a silent patch bump must not change what it
# writes without that claim being updated too. xtask has its own workspace
# and lockfile (see `[workspace]` below): nothing here reaches the shipped
# product's dependency graph.
rust_xlsxwriter = { version = "=0.99.0", default-features = false }
# RFC-094 §3, RFC-096 §5: `cargo xtask json-schema` parses `forskscope
# compare --format json`'s actual output to validate it against
# docs/schemas/forskscope.comparison.v1.json - DEC-005's "no JSON parser"
# reasoning (crate_boundaries.rs's own doc comment) is about avoiding a
# parser where a text-pattern check would do; validating real JSON against
# a real JSON Schema file has no such substitute, so this is xtask's first
# and only JSON dependency.
serde_json = "1"
