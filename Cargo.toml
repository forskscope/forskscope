[workspace]
resolver = "3"
members = [
    "crates/forskscope-commands",
    "crates/forskscope-compare",
    "crates/forskscope-desktop",
    "crates/forskscope-edit",
    "crates/forskscope-report",
    "crates/forskscope-ui",
    "crates/forskscope-ui-logic",
]

[workspace.package]
version = "0.196.2"

edition         = "2024"
rust-version    = "1.91"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/forskscope/forskscope"

[workspace.dependencies]
forskscope-commands          = { version = "0", path = "crates/forskscope-commands" }
forskscope-compare           = { version = "0", path = "crates/forskscope-compare" }
forskscope-desktop           = { version = "0", path = "crates/forskscope-desktop" }
forskscope-edit             = { version = "0", path = "crates/forskscope-edit" }
forskscope-report           = { version = "0", path = "crates/forskscope-report" }
forskscope-ui-logic         = { version = "0", path = "crates/forskscope-ui-logic" }

dioxus                      = { version = "0.7", default-features = false, features = ["lib"] }
dioxus-core                 = "0.7"
dioxus-desktop              = { version = "0.7", default-features = false, features = ["tokio_runtime"] }
dioxus-swdir-tree           = "0.7"
# dioxus-desktop 0.7.9 calls wry devtools methods from release builds even
# without dioxus-desktop/devtools. Enable only wry's method surface, not
# dioxus-devtools.
wry                         = { version = "0.53", default-features = false, features = ["devtools"] }

app-json-settings           = "2"
chardetng                   = "0.1"
dirs-next                   = "2"
encoding_rs                 = "0.8"
# F180: already resolved transitively (tungstenite -> dioxus-desktop); its
# first direct, declared use is the update-check request's TLS (handoff
# 073) - no new TLS stack, no new system library. audit-deps' reviewed set
# names forskscope-ui as a second accepted path.
native-tls                  = "0.2"
rfd                         = { version = "0.17", default-features = true }
# RFC-092/F206-adjacent (handoff 084): already resolved transitively
# (wry -> forskscope-ui) at 0.10.9; its first direct, declared use was
# forskscope-core's comparison-report checksums, moved to
# forskscope-report by RFC-093 §1 step 2 - no new crypto stack either way.
# audit-deps' reviewed set names forskscope-report as a second accepted path.
sha2                        = "0.10"
# RFC-096 §4: already resolved transitively (wry/tao's own Windows build)
# at 0.61.x; its first direct, declared use is forskscope-ui's own
# Windows-only console attach for a subcommand run from a terminal
# (AttachConsole/GetStdHandle/GetFileType) - no new Windows API surface
# in the dependency tree, only a new edge to one already there.
windows-sys                 = { version = "0.61", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }
# RFC-095 §4.7: already resolved transitively (gtk/webkit2gtk -> wry's
# Linux build) at 0.18.x; its first direct, declared use is
# forskscope-ui's own Flatpak-only `glib::set_prgname` (the program name
# becomes the Flatpak app ID, before GTK initialises) - no new GLib
# binding surface in the dependency tree, only a new edge to one already
# there.
glib                         = { version = "0.18", default-features = false }
# RFC-095 §4.4: already resolved transitively (gethostname/tempfile) at
# 1.x; its first direct, declared use is forskscope-desktop's own
# Flatpak-only read of the `user.document-portal.host-path` extended
# attribute (`getxattr`, the "fs" feature) - a safe wrapper over the raw
# syscall, no hand-rolled unsafe FFI, and no new crate version.
rustix                       = { version = "1", default-features = false, features = ["fs"] }
# RFC-085: default features off deliberately - chrono/cli/serde are all
# optional and unused here; audit-deps' reviewed set assumes exactly the
# calamine -> quick-xml -> zip chain this default-features build pulls.
sheets-diff                 = "3.6.0"
similar                     = "3.2"

chrono                      = "0.4"
serde                       = { version = "1", features = ["derive"] }
serde_json                  = { version = "1" }
tokio                       = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }

# Testing
tempfile                    = "3"
# F138: setrlimit(RLIMIT_AS, ..) for tests/f138_decline_before_delegating.rs,
# unix-only and dev-only. Already resolved transitively (many crates depend on
# it); this is its first direct, declared use.
libc                        = "0.2"

[profile.release]
lto = true
strip = true

# F179: muda 0.17.2 with its libxdo dependency removed. See vendor/README.md.
[patch.crates-io]
muda = { path = "vendor/muda" }
