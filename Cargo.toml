[workspace]
resolver = "3"
members = [
    "crates/forskscope-core",
    "crates/forskscope-ui",
    "crates/forskscope-ui-logic",
]

[workspace.package]
version = "0.167.3"

edition         = "2024"
rust-version    = "1.91"
license         = "Apache-2.0"
authors         = ["nabbisen"]
repository      = "https://github.com/forskscope/forskscope"

[workspace.dependencies]
forskscope-core             = { version = "0", path = "crates/forskscope-core" }
forskscope-ui-logic         = { version = "0", path = "crates/forskscope-ui-logic" }

dioxus                      = { version = "0.7", default-features = false, features = ["lib"] }
dioxus-core                 = "0.7"
dioxus-desktop              = { version = "0.7", default-features = false, features = ["tokio_runtime"] }
dioxus-swdir-tree           = "0.7"
# dioxus-desktop 0.7.9 calls wry devtools methods from release builds even
# without dioxus-desktop/devtools. Enable only wry's method surface, not
# dioxus-devtools.
wry                         = { version = "0.53", default-features = false, features = ["devtools"] }

app-json-settings           = "2"
chardetng                   = "0.1"
dirs-next                   = "2"
encoding_rs                 = "0.8"
rfd                         = { version = "0.17", default-features = true }
similar                     = "3.1"

chrono                      = "0.4"
serde                       = { version = "1", features = ["derive"] }
serde_json                  = { version = "1" }
tokio                       = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time"] }

# Testing
tempfile                    = "3"

[profile.release]
lto = true
strip = true
