name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ── Release gates ───────────────────────────────────────────────────────────
  preflight:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-gates-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test -p forskscope-core -p forskscope-ui-logic

      - name: cargo clippy
        run: cargo clippy -p forskscope-core -p forskscope-ui-logic -- -D warnings

      - name: CSS generated artifact check
        run: cargo xtask css --check

      - name: Security advisory audit
        run: cargo audit

      - name: Security dependency path check
        run: cargo xtask audit-deps

      - name: Version metadata sync check
        run: cargo xtask version-sync "${GITHUB_REF_NAME#v}"

      - name: i18n coverage check
        run: cargo xtask i18n

  # ── Source archive ──────────────────────────────────────────────────────────
  source:
    name: Source archive
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        run: |
          VER=${{ steps.ver.outputs.version }}
          git archive --format=tar.gz \
              --output="${RUNNER_TEMP}/forskscope-v${VER}.tar.gz" \
              HEAD

      - name: Verify source archive layout
        run: |
          VER=${{ steps.ver.outputs.version }}
          cargo xtask archive-layout "${RUNNER_TEMP}/forskscope-v${VER}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: ${{ runner.temp }}/forskscope-v${{ steps.ver.outputs.version }}.tar.gz

  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: source
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      - name: Package
        run: |
          VER=${{ needs.source.outputs.version }}
          tar -czf "forskscope-v${VER}-linux-x86_64.tar.gz" \
              -C target/release forskscope

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: forskscope-v*-linux-x86_64.tar.gz

  # ── macOS aarch64 ───────────────────────────────────────────────────────────
  macos:
    name: macOS aarch64
    runs-on: macos-14
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install packaging tools
        run: brew install create-dmg

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: macos-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked --target aarch64-apple-darwin -p forskscope-ui

      - name: Package
        run: bash packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: target/forskscope-v*-macos-aarch64.dmg

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      - name: Package
        shell: bash
        run: |
          VER=${{ needs.source.outputs.version }}
          STAGE="target/forskscope-v${VER}-windows-x64"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp target/release/forskscope.exe "$STAGE/forskscope.exe"
          cp README.md LICENSE NOTICE CHANGELOG.md "$STAGE/"
          (cd target && 7z a "../forskscope-v${VER}-windows-x64.zip" "$(basename "$STAGE")/")

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: forskscope-v*-windows-x64.zip

  # ── Create GitHub release ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [source, linux, macos, windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            forskscope-v*.tar.gz
            forskscope-v*-linux-x86_64.tar.gz
            forskscope-v*-macos-aarch64.dmg
            forskscope-v*-windows-x64.zip
