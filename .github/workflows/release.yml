name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

# F175: one tag push started this workflow twice while cutting 0.181.0, and
# the two runs raced in the release step. Queue a second run behind the first
# instead. `cancel-in-progress: false` is deliberate: cancelling a run mid-upload
# is the outcome this exists to prevent.
# Measured (architect, 2026-10-06): at most one run waits per group. Three
# dispatches six seconds apart gave 37455568001 (ran), 37455579254 (cancelled
# before any job started, replaced by the third) and 37455590498 (ran). A
# cancelled run in the list is a queued duplicate, not someone intervening.
# The group key includes the tag, so runs for different tags never replace
# each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Release gates ───────────────────────────────────────────────────────────
  preflight:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # F175: a duplicate run of this workflow for the same tag reaches here
      # after the first run has published, and the release step would then
      # re-upload over finished assets while the release still looked complete.
      # The concurrency group above means this job starts only once the first
      # run has finished, so the release already exists complete if it ever
      # will. Checked by hand: a first publish (no release yet) and a partial
      # release pass; a re-run is attempt 2 or later and passes. Here, not in
      # `release`, so a refused duplicate never rebuilds the three platforms.
      # `run_attempt` tells the duplicate apart from a deliberate re-run: a new
      # event starts at attempt 1, and "re-run failed jobs" or "re-run all jobs"
      # on the same run increments it to 2 and up.
      - name: Refuse a first attempt over a finished release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ "$RUN_ATTEMPT" != "1" ]; then
            echo "run attempt ${RUN_ATTEMPT}: a re-run, so the release step may update ${TAG}"
            exit 0
          fi
          if ! ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>&1)"; then
            case "$ASSETS" in
              *"not found"*) echo "no release for ${TAG} yet: this is its first publish"; exit 0 ;;
              *) echo "::error::could not read release ${TAG} to check for a finished publish: ${ASSETS}"; exit 1 ;;
            esac
          fi
          for want in "forskscope-v${TAG}-linux-x86_64.tar.gz" "forskscope-v${TAG}-macos-aarch64.dmg" "forskscope-v${TAG}-windows-x64.zip"; do
            if ! printf '%s\n' "$ASSETS" | grep -qxF "$want"; then
              echo "release ${TAG} has no ${want} yet: this is its first publish"
              exit 0
            fi
          done
          echo "::error::release ${TAG} already has all three assets and this is run attempt 1, so this is a duplicate of a finished publish. Refusing to upload over it. A deliberate re-run of the same run is attempt 2 and is allowed."
          exit 1

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-gates-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test -p forskscope-core -p forskscope-ui-logic

      - name: cargo clippy
        run: cargo clippy -p forskscope-core -p forskscope-ui-logic -- -D warnings

      - name: CSS generated artifact check
        run: cargo xtask css --check

      - name: Security advisory audit
        run: cargo audit

      - name: Security dependency path check
        run: cargo xtask audit-deps

      - name: Version metadata sync check
        run: cargo xtask version-sync "${GITHUB_REF_NAME}"

      - name: i18n coverage check
        run: cargo xtask i18n

  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            xvfb dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      # F179/F180: the graph check in `cargo xtask audit-deps` reports what
      # Cargo intends; this reports what the linker actually produced
      # (review 151's lesson - a check on a copy is not a check on the
      # thing). F180 (handoff 073) added `native-tls` as a direct
      # dependency for the update-check request; this list is the exact
      # 16 libraries 0.186.0 already linked, so this also proves that
      # change added nothing new, not only that libxdo stayed gone.
      - name: Linux binary links the same 16 libraries as 0.186.0 (F179/F180)
        run: |
          EXPECTED="libwayland-client.so.0
          libm.so.6
          libssl.so.3
          libcrypto.so.3
          libwebkit2gtk-4.1.so.0
          libgtk-3.so.0
          libgdk-3.so.0
          libgdk_pixbuf-2.0.so.0
          libcairo.so.2
          libsoup-3.0.so.0
          libgio-2.0.so.0
          libjavascriptcoregtk-4.1.so.0
          libgobject-2.0.so.0
          libglib-2.0.so.0
          libgcc_s.so.1
          libc.so.6"
          ACTUAL=$(readelf -d target/release/forskscope \
            | grep NEEDED \
            | sed -E 's/.*\[(.*)\]/\1/')
          DIFF=$(diff <(echo "$EXPECTED" | sed 's/^ *//' | sort) <(echo "$ACTUAL" | sort)) || true
          if [ -n "$DIFF" ]; then
            echo "::error::target/release/forskscope's linked libraries differ from 0.186.0's 16:"
            echo "$DIFF"
            exit 1
          fi

      # F34: nothing had ever looked at the rendered application before this
      # - F32 shipped misaligned in two releases with every gate green, and
      # 0.166.0 shipped with no artifact having been launched by anyone
      # (F44 followed). Drives the actual just-built binary against a fixed
      # file pair (Replace + Delete + Insert hunks together, pinned by a
      # core corpus test) under a virtual display and a real AT-SPI bus, and
      # asserts every diff row's on-screen geometry matches its neighbours -
      # the visual symptom F32 actually had, not just its one historical
      # cause. See packaging/render_check.py's module docstring for the
      # full design rationale, and its falsifiability demonstration in the
      # review request this landed with.
      - name: Compare view renders without column misalignment (F34)
        run: |
          xvfb-run --auto-servernum dbus-run-session -- \
            env NO_AT_BRIDGE=0 python3 packaging/render_check.py target/release/forskscope

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"
          tar -czf "forskscope-v${VER}-linux-x86_64.tar.gz" \
              -C target/release forskscope

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: forskscope-v*-linux-x86_64.tar.gz

  # ── macOS aarch64 ───────────────────────────────────────────────────────────
  macos:
    name: macOS aarch64
    runs-on: macos-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install packaging tools
        run: brew install create-dmg

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: macos-release-${{ hashFiles('**/Cargo.lock') }}

      # F49: explicit, not left to whatever SDK the runner image happens to
      # carry — Info.plist's LSMinimumSystemVersion (packaging/macos/build-dmg.sh)
      # must keep agreeing with this. 13.0 matches the Info.plist value already
      # in place; see this slice's review request for the open question on
      # whether that floor itself should change.
      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo build --release --locked --target aarch64-apple-darwin -p forskscope-ui

      - name: Package
        run: bash packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64
          path: target/forskscope-v*-macos-aarch64.dmg

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME}"
          STAGE="target/forskscope-v${VER}-windows-x64"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp target/release/forskscope.exe "$STAGE/forskscope.exe"
          cp README.md LICENSE NOTICE CHANGELOG.md "$STAGE/"
          (cd target && 7z a "../forskscope-v${VER}-windows-x64.zip" "$(basename "$STAGE")/")

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: forskscope-v*-windows-x64.zip

  # ── Create GitHub release ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    steps:
      # Must run before actions/download-artifact: checkout cleans the
      # workspace by default, and would wipe downloaded artifacts if it ran
      # after them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # F24: this empty-section guard used to be the *only* check, and it ran
      # here — after the tag and all three platform builds already existed,
      # so recovering from an empty section meant a re-cut.
      # `preflight`'s `cargo xtask version-sync "${GITHUB_REF_NAME}"` now
      # rejects an empty section before any of that work starts (`xtask`'s
      # release mode, not just its dev-mode header-presence check). This one
      # stays as a second, independent check on the same condition — cheap,
      # and it would still catch a preflight regression — but preflight is
      # the one that actually saves the re-cut.
      - name: Compose release notes from CHANGELOG
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            BEGIN { hdr = "## [" ver "]" }
            index($0, hdr) == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "::error::CHANGELOG section for ${GITHUB_REF_NAME} is missing or empty"; exit 1; }

          # F179: the prebuilt Linux tarball no longer links libxdo (the
          # Linux job's readelf check enforces this), so it is no longer
          # Debian/Ubuntu-family only - it starts on Arch too, measured on
          # an Arch-based machine. It is still built on Ubuntu, so it still
          # needs a glibc at least as new as that runner's. The Releases
          # page is where people download, so the qualification belongs
          # here and not only in the docs -- that gap is what let F44 read
          # as an unqualified claim.
          {
            echo ""
            echo "### Platform notes"
            echo ""
            echo "- **Linux (\`*-linux-x86_64.tar.gz\`)** is built on Ubuntu; it needs a glibc at least as new as that build runner's. It starts on Arch as well as on Ubuntu. It has not been run on other distributions."
            echo "- **Windows** is tested on Windows 11. It installs on Windows 10 1809+ but is untested there; Windows 10 reached end of support on 2025-10-14."
            echo "- **macOS (\`*.dmg\`)** is **not signed with an Apple Developer ID and not notarized**, so Gatekeeper will refuse it on first launch. Right-click the app and choose **Open**, or run \`xattr -d com.apple.quarantine /Applications/ForskScope.app\`. Requires macOS 13.0 or later."
            echo ""
            echo "### Verifying your download"
            echo ""
            echo "\`SHA256SUMS\` (below) lists a SHA-256 digest for each of the three"
            echo "platform assets. It protects against a corrupted or incomplete"
            echo "download, not against the build host being compromised - it is computed"
            echo "here, on the same runner that builds the assets. Signing is a"
            echo "separate, open question (F46) and is not part of this release."
            echo ""
            echo "\`\`\`sh"
            echo "# Linux"
            echo "sha256sum -c SHA256SUMS --ignore-missing"
            echo ""
            echo "# macOS"
            echo "grep macos-aarch64 SHA256SUMS | shasum -a 256 -c"
            echo "\`\`\`"
            echo ""
            echo "\`\`\`powershell"
            echo "# Windows"
            echo "Get-FileHash forskscope-v${GITHUB_REF_NAME}-windows-x64.zip -Algorithm SHA256"
            echo "# then compare against the matching line in SHA256SUMS by hand"
            echo "\`\`\`"
          } >> release-notes.md

          PREV_TAG=$(git tag --sort=-creatordate | awk -v cur="${GITHUB_REF_NAME}" 'found{print; exit} $0==cur{found=1}')
          if [ -n "$PREV_TAG" ]; then
            {
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            } >> release-notes.md
          fi

      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      # F181: a fourth asset, computed from the same three files this job is
      # about to attach. Standard `sha256sum` output format, so the commands
      # named in the release notes above work unmodified.
      - name: Compute checksums
        run: |
          sha256sum \
            forskscope-v*-linux-x86_64.tar.gz \
            forskscope-v*-macos-aarch64.dmg \
            forskscope-v*-windows-x64.zip \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          # F156: the GitHub release publishes immediately instead of waiting as
          # a draft. The owner authorised this on 2026-10-01 because a draft is
          # invisible on the front page and kept being missed. This used to
          # remove the approval gate RFC-079 and RFC-081 both rest on; handoff
          # 061 restored that gate on distribution instead of on visibility -
          # aur-publish.yml and store-submit.yml no longer trigger on this
          # release existing at all, only on the owner explicitly dispatching
          # them (F158's finding that a `GITHUB_TOKEN`-authored publish event
          # never started them anyway is also why that move cost nothing).
          draft: false
          body_path: release-notes.md
          files: |
            forskscope-v*-linux-x86_64.tar.gz
            forskscope-v*-macos-aarch64.dmg
            forskscope-v*-windows-x64.zip
            SHA256SUMS

      # The run page is where someone looks after tagging, so it carries what is
      # left to do - now an explicit dispatch of each distribution workflow,
      # not a broken automatic one (F147/F156/F158, handoff 061).
      - name: Say what is left to do
        env:
          VER: ${{ github.ref_name }}
          URL: ${{ steps.create_release.outputs.url }}
        run: |
          {
            echo "## ${VER} is published"
            echo
            echo "- Release: ${URL}"
            echo
            echo "### Distribution is a separate, explicit step"
            echo
            echo "Publishing this release did not start the AUR or Microsoft"
            echo "Store workflows - both are dispatched by hand, every time,"
            echo "so a person always decides when either reaches the outside"
            echo "world:"
            echo
            echo "\`\`\`sh"
            echo "gh workflow run aur-publish.yml -f mode=release -f tag=${VER} -f dry_run=false"
            echo "gh workflow run store-submit.yml -f tag=${VER} -f dry_run=false"
            echo "\`\`\`"
            echo
            echo "See the maintainer release guide for the dry-run rehearsal of"
            echo "each. The Store submission still returns \`Unauthorized\` until"
            echo "the Partner Center tenant association exists (F106, separate"
            echo "from this release and still open)."
          } >> "$GITHUB_STEP_SUMMARY"
