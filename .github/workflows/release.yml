name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # ── Release gates ───────────────────────────────────────────────────────────
  preflight:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: release-gates-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo test
        run: cargo test -p forskscope-core -p forskscope-ui-logic

      - name: cargo clippy
        run: cargo clippy -p forskscope-core -p forskscope-ui-logic -- -D warnings

      - name: CSS generated artifact check
        run: cargo xtask css --check

      - name: Security advisory audit
        run: cargo audit

      - name: Security dependency path check
        run: cargo xtask audit-deps

      - name: Version metadata sync check
        run: cargo xtask version-sync "${GITHUB_REF_NAME}"

      - name: i18n coverage check
        run: cargo xtask i18n

  # ── Linux x86_64 ────────────────────────────────────────────────────────────
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            xvfb dbus-x11 at-spi2-core python3-gi gir1.2-atspi-2.0

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      # F34: nothing had ever looked at the rendered application before this
      # - F32 shipped misaligned in two releases with every gate green, and
      # 0.166.0 shipped with no artifact having been launched by anyone
      # (F44 followed). Drives the actual just-built binary against a fixed
      # file pair (Replace + Delete + Insert hunks together, pinned by a
      # core corpus test) under a virtual display and a real AT-SPI bus, and
      # asserts every diff row's on-screen geometry matches its neighbours -
      # the visual symptom F32 actually had, not just its one historical
      # cause. See packaging/render_check.py's module docstring for the
      # full design rationale, and its falsifiability demonstration in the
      # review request this landed with.
      - name: Compare view renders without column misalignment (F34)
        run: |
          xvfb-run --auto-servernum dbus-run-session -- \
            env NO_AT_BRIDGE=0 python3 packaging/render_check.py target/release/forskscope

      - name: Package
        run: |
          VER="${GITHUB_REF_NAME}"
          tar -czf "forskscope-v${VER}-linux-x86_64.tar.gz" \
              -C target/release forskscope

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: forskscope-v*-linux-x86_64.tar.gz

  # ── macOS aarch64 ───────────────────────────────────────────────────────────
  macos:
    name: macOS aarch64
    runs-on: macos-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install packaging tools
        run: brew install create-dmg

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: macos-release-${{ hashFiles('**/Cargo.lock') }}

      # F49: explicit, not left to whatever SDK the runner image happens to
      # carry — Info.plist's LSMinimumSystemVersion (packaging/macos/build-dmg.sh)
      # must keep agreeing with this. 13.0 matches the Info.plist value already
      # in place; see this slice's review request for the open question on
      # whether that floor itself should change.
      - name: Build release binary
        env:
          MACOSX_DEPLOYMENT_TARGET: "13.0"
        run: cargo build --release --locked --target aarch64-apple-darwin -p forskscope-ui

      - name: Package
        run: bash packaging/macos/build-dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos-aarch64
          path: target/forskscope-v*-macos-aarch64.dmg

  # ── Windows x86_64 ──────────────────────────────────────────────────────────
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      - name: Package
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME}"
          STAGE="target/forskscope-v${VER}-windows-x64"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp target/release/forskscope.exe "$STAGE/forskscope.exe"
          cp README.md LICENSE NOTICE CHANGELOG.md "$STAGE/"
          (cd target && 7z a "../forskscope-v${VER}-windows-x64.zip" "$(basename "$STAGE")/")

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: forskscope-v*-windows-x64.zip

  # ── Create GitHub release ───────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [linux, macos, windows]
    steps:
      # Must run before actions/download-artifact: checkout cleans the
      # workspace by default, and would wipe downloaded artifacts if it ran
      # after them.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # F24: this empty-section guard used to be the *only* check, and it ran
      # here — after the tag and all three platform builds already existed,
      # so recovering from an empty section meant a re-cut.
      # `preflight`'s `cargo xtask version-sync "${GITHUB_REF_NAME}"` now
      # rejects an empty section before any of that work starts (`xtask`'s
      # release mode, not just its dev-mode header-presence check). This one
      # stays as a second, independent check on the same condition — cheap,
      # and it would still catch a preflight regression — but preflight is
      # the one that actually saves the re-cut.
      - name: Compose release notes from CHANGELOG
        run: |
          awk -v ver="${GITHUB_REF_NAME}" '
            BEGIN { hdr = "## [" ver "]" }
            index($0, hdr) == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > release-notes.md
          grep -q '[^[:space:]]' release-notes.md || { echo "::error::CHANGELOG section for ${GITHUB_REF_NAME} is missing or empty"; exit 1; }

          PREV_TAG=$(git tag --sort=-creatordate | awk -v cur="${GITHUB_REF_NAME}" 'found{print; exit} $0==cur{found=1}')
          if [ -n "$PREV_TAG" ]; then
            {
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            } >> release-notes.md
          fi

      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          body_path: release-notes.md
          files: |
            forskscope-v*.tar.gz
            forskscope-v*-linux-x86_64.tar.gz
            forskscope-v*-macos-aarch64.dmg
            forskscope-v*-windows-x64.zip
