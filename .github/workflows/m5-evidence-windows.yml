name: M5 Evidence - Windows

# M5-A: runs P01/P02/P09/P10 against the *published* 0.167.0 Windows
# artifact (downloaded from the release, digest-verified - never built
# from source, per RFC-078 §5: the evidence is about what users actually
# have) on windows-latest, representing the windows-11/windows-10 CI rows
# per matrix-plan.md (both rows are CI-verified via windows-latest; see
# that file's justification for treating a Server-based image as a
# reasonable stand-in for save/filesystem/WebView2 behavior on either).
#
# M5-B adds P04, P05, P06, P08, P12 - the interaction cases - against the
# same published artifact and digest, same workflow_dispatch/one-case-
# per-run shape. See packaging/evidence/windows_harness.py's module
# docstring for each case's reasoning, including P04's mouse-only scope
# (§3 of the M5-B handoff) and P08/P12's use of the runner's real config
# directory instead of an (ineffective, on Windows) APPDATA override.
#
# Mirrors m5-evidence-linux.yml's shape exactly (workflow_dispatch, one
# case per run, `break_case` for the falsifiability demonstration) but
# drives the app through Windows UI Automation via `pywinauto` instead of
# AT-SPI - see packaging/evidence/windows_harness.py's module docstring
# for why, and for the one deliberate structural deviation from the Linux
# harness (content-token presence instead of an exact row count).
#
# `break_case: true` runs the selected case's built-in falsifiability
# demonstration (packaging/evidence/windows_harness.py's `--break` flag) -
# each case asserts against a condition that cannot be satisfied, proving
# the check is a real assertion and not vacuously green.
on:
  workflow_dispatch:
    inputs:
      case:
        description: 'Which case to run'
        type: choice
        options: [p01, p02, p04, p05, p06, p08, p09, p10, p12]
        required: true
      break_case:
        description: 'Run in --break mode (falsifiability demonstration)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  evidence:
    name: M5-A Windows evidence
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Record the resolved runner image, not just the rolling
      # `windows-latest` label - review 057 §4.3's caveat, same as
      # linux-x11.md's evidence file records ubuntu-24.04's image version.
      - name: Record resolved runner image
        shell: pwsh
        run: |
          Write-Host "ImageOS: $env:ImageOS"
          Write-Host "ImageVersion: $env:ImageVersion"
          [System.Environment]::OSVersion.VersionString | Write-Host

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install pywinauto
        # psutil: M5-B's P08 Exit sub-case needs to confirm the OS process
        # is actually gone after clicking Exit, not just that the dialog
        # closed (handoff §4/§6) - psutil.pid_exists() queries the OS
        # directly, the same thing an external operator checking for a
        # zombie process would do.
        run: python -m pip install --disable-pip-version-check pywinauto psutil

      - name: Download published 0.167.0 Windows artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 0.167.0 -R "${{ github.repository }}" -p "forskscope-v0.167.0-windows-x64.zip"

      # RFC-078 §5: verify after download, never trust the release page.
      - name: Verify digest
        shell: pwsh
        run: |
          $expected = "bd7c1d9107754f7866639de7d09668fcd0c70ca5669f5cbee15ccdfeca293c1d"
          $actual = (Get-FileHash -Algorithm SHA256 forskscope-v0.167.0-windows-x64.zip).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "digest mismatch: expected $expected, got $actual"
            exit 1
          }
          Write-Host "digest OK: $actual"

      - name: Extract
        shell: pwsh
        run: Expand-Archive -Path forskscope-v0.167.0-windows-x64.zip -DestinationPath extracted

      - name: Run case
        shell: pwsh
        run: |
          $breakFlag = @()
          if ("${{ inputs.break_case }}" -eq "true") {
            $breakFlag = @("--break")
          }
          python packaging/evidence/windows_harness.py `
            "${{ inputs.case }}" `
            "extracted/forskscope-v0.167.0-windows-x64/forskscope.exe" `
            @breakFlag
