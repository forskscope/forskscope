name: Windows Check

# F109 (review 109 §4): dispatchable on demand, so the WebView2 detection
# check (crates/forskscope-ui/src/webview2.rs, wired in main.rs) is proven
# against a real windows-latest runner before it ships in a release, not
# for the first time inside release.yml itself. workflow_dispatch only -
# no push trigger, so nothing runs unless someone asks for it, and no
# rehearsal tag is ever needed (review 108 §5).
#
# Builds the same release binary release.yml's Windows job builds, then
# runs `--diagnostics` twice: once as-is (WebView2 present on this
# runner), once with WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at a
# fresh empty directory (the WebView2 loader's own env var, which the
# F109 handoff expects to make detection fail even though the runtime is
# actually installed). Both outputs are printed regardless of outcome.

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: WebView2 detection (F109)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope

      # The binary is windows_subsystem = "windows" in a release build, so
      # the first thing this step must confirm is that its stdout actually
      # reaches this log at all - a GUI-subsystem exe has no console of its
      # own, but a CI runner invokes it with its stdout piped/redirected,
      # which is what actually determines whether a write to the stdout
      # handle goes anywhere, independent of console attachment. Checked
      # empirically below, not assumed either way.
      - name: Run --diagnostics and assert WebView2 detection
        shell: pwsh
        run: |
          $normal = & ./target/release/forskscope.exe --diagnostics 2>&1 | Out-String
          Write-Host "--- diagnostics: WebView2 present (this runner's real install) ---"
          Write-Host $normal

          if ([string]::IsNullOrWhiteSpace($normal)) {
            Write-Error "no stdout was captured at all from the release (windows_subsystem = 'windows') binary - this is a GUI-subsystem stdout-capture problem, not a WebView2 detection problem, and it means the assertions below would test nothing."
            exit 1
          }

          $empty = Join-Path $env:RUNNER_TEMP "empty-webview2-dir"
          New-Item -ItemType Directory -Path $empty -Force | Out-Null
          $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = $empty
          $forced = & ./target/release/forskscope.exe --diagnostics 2>&1 | Out-String
          Remove-Item Env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER
          Write-Host "--- diagnostics: WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at an empty directory ---"
          Write-Host $forced

          $ok = $true

          if ($normal -notmatch '(?m)^WebView2 runtime: \d') {
            Write-Error "expected a line matching '^WebView2 runtime: \d' (a version) in the normal run - got:`n$normal"
            $ok = $false
          }

          if ($forced -notmatch '(?m)^WebView2 runtime: not found \(') {
            Write-Error "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at an empty directory did not produce a 'not found' line - it may not actually simulate a missing runtime on this runner. Got:`n$forced"
            $ok = $false
          }

          if (-not $ok) {
            exit 1
          }
          Write-Host "Both assertions passed."

  # RFC-091 §4 (F45): the hybrid-CRT release gate, Windows' equivalent of
  # the Linux 16-library check (F179/F180, release.yml). Dispatchable on
  # demand for the same reason as the job above: proven against a real
  # windows-latest runner before it ships, no rehearsal tag needed.
  #
  # F206: this job alone was not enough - it is dispatched by hand, and
  # the release itself never called anything like it. The gate's logic now
  # lives in packaging/windows/check-imports.ps1, shared with release.yml's
  # Windows job and store-build.ps1, so this job and the release cannot
  # silently diverge again.
  crt-import-check:
    name: Hybrid CRT import check (RFC-091 §4, F45, F206)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-crt-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --release --locked -p forskscope

      - name: Check imports against the allow-list
        shell: pwsh
        run: ./packaging/windows/check-imports.ps1 -ExePath ./target/release/forskscope.exe

  # TEMPORARY (handoff 091/RFC-096 §6 step 6): rehearses release.yml's
  # Linux job's own one-program changes - the removed forskscope-cli
  # link check, and a packaging run - against a real ubuntu-latest
  # runner before they ship in a real release, the same way the two jobs
  # above already rehearse the Windows side. No tag is needed: this
  # mirrors F206's own temporary-job precedent (review 172,
  # bea5053f60b2d715873bd05b0df8faaf8c8f3cd1) rather than release.yml's
  # own tag-triggered path. Reverted once the passing run is recorded in
  # the review response.
  linux-release-rehearsal:
    name: "TEMPORARY: Linux release packaging rehearsal (RFC-096 §6)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked -p forskscope

      # Same 16 libraries release.yml's Linux job checks for - confirms
      # the one-program build still links exactly what 0.195.0 did,
      # unchanged by the forskscope-cli removal.
      - name: Linux binary links the same 16 libraries as 0.195.0
        run: |
          EXPECTED="libwayland-client.so.0
          libm.so.6
          libssl.so.3
          libcrypto.so.3
          libwebkit2gtk-4.1.so.0
          libgtk-3.so.0
          libgdk-3.so.0
          libgdk_pixbuf-2.0.so.0
          libcairo.so.2
          libsoup-3.0.so.0
          libgio-2.0.so.0
          libjavascriptcoregtk-4.1.so.0
          libgobject-2.0.so.0
          libglib-2.0.so.0
          libgcc_s.so.1
          libc.so.6"
          ACTUAL=$(readelf -d target/release/forskscope \
            | grep NEEDED \
            | sed -E 's/.*\[(.*)\]/\1/')
          DIFF=$(diff <(echo "$EXPECTED" | sed 's/^ *//' | sort) <(echo "$ACTUAL" | sort)) || true
          if [ -n "$DIFF" ]; then
            echo "::error::target/release/forskscope's linked libraries differ from 0.195.0's 16:"
            echo "$DIFF"
            exit 1
          fi

      - name: Package (release.yml's own tar command)
        run: |
          tar -czf forskscope-vREHEARSAL-linux-x86_64.tar.gz \
              -C target/release forskscope

      - name: List the archive's contents (proves one program, not two)
        run: tar -tzvf forskscope-vREHEARSAL-linux-x86_64.tar.gz
