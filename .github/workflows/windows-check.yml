name: Windows Check

# F109 (review 109 §4): dispatchable on demand, so the WebView2 detection
# check (crates/forskscope-ui/src/webview2.rs, wired in main.rs) is proven
# against a real windows-latest runner before it ships in a release, not
# for the first time inside release.yml itself. workflow_dispatch only -
# no push trigger, so nothing runs unless someone asks for it, and no
# rehearsal tag is ever needed (review 108 §5).
#
# Builds the same release binary release.yml's Windows job builds, then
# runs `--diagnostics` twice: once as-is (WebView2 present on this
# runner), once with WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at a
# fresh empty directory (the WebView2 loader's own env var, which the
# F109 handoff expects to make detection fail even though the runtime is
# actually installed). Both outputs are printed regardless of outcome.

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: WebView2 detection (F109)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      # The binary is windows_subsystem = "windows" in a release build, so
      # the first thing this step must confirm is that its stdout actually
      # reaches this log at all - a GUI-subsystem exe has no console of its
      # own, but a CI runner invokes it with its stdout piped/redirected,
      # which is what actually determines whether a write to the stdout
      # handle goes anywhere, independent of console attachment. Checked
      # empirically below, not assumed either way.
      - name: Run --diagnostics and assert WebView2 detection
        shell: pwsh
        run: |
          $normal = & ./target/release/forskscope.exe --diagnostics 2>&1 | Out-String
          Write-Host "--- diagnostics: WebView2 present (this runner's real install) ---"
          Write-Host $normal

          if ([string]::IsNullOrWhiteSpace($normal)) {
            Write-Error "no stdout was captured at all from the release (windows_subsystem = 'windows') binary - this is a GUI-subsystem stdout-capture problem, not a WebView2 detection problem, and it means the assertions below would test nothing."
            exit 1
          }

          $empty = Join-Path $env:RUNNER_TEMP "empty-webview2-dir"
          New-Item -ItemType Directory -Path $empty -Force | Out-Null
          $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = $empty
          $forced = & ./target/release/forskscope.exe --diagnostics 2>&1 | Out-String
          Remove-Item Env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER
          Write-Host "--- diagnostics: WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at an empty directory ---"
          Write-Host $forced

          $ok = $true

          if ($normal -notmatch '(?m)^WebView2 runtime: \d') {
            Write-Error "expected a line matching '^WebView2 runtime: \d' (a version) in the normal run - got:`n$normal"
            $ok = $false
          }

          if ($forced -notmatch '(?m)^WebView2 runtime: not found \(') {
            Write-Error "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at an empty directory did not produce a 'not found' line - it may not actually simulate a missing runtime on this runner. Got:`n$forced"
            $ok = $false
          }

          if (-not $ok) {
            exit 1
          }
          Write-Host "Both assertions passed."

  # RFC-091 §4 (F45): the hybrid-CRT release gate, Windows' equivalent of
  # the Linux 16-library check (F179/F180, release.yml). Dispatchable on
  # demand for the same reason as the job above: proven against a real
  # windows-latest runner before it ships, no rehearsal tag needed.
  #
  # F206: this job alone was not enough - it is dispatched by hand, and
  # the release itself never called anything like it. The gate's logic now
  # lives in packaging/windows/check-imports.ps1, shared with release.yml's
  # Windows job and store-build.ps1, so this job and the release cannot
  # silently diverge again.
  crt-import-check:
    name: Hybrid CRT import check (RFC-091 §4, F45, F206)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-crt-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      - name: Check imports against the allow-list
        shell: pwsh
        run: ./packaging/windows/check-imports.ps1 -ExePath ./target/release/forskscope.exe

  # TEMPORARY (review 177 / handoff 085, F207) - proves, on a real
  # windows-latest runner, before shipping:
  #   - #Requires -Version 7.0 refuses Windows PowerShell 5.1 before any of
  #     a script's own body runs (item 1's falsification);
  #   - the UTF-8 manifest-read fix actually differs from the old
  #     Get-Content -Raw -> [xml] read under a forced non-UTF-8 default
  #     encoding (item 2's regression test);
  #   - store-package.ps1 builds and validates a tag end to end, never
  #     switches the caller's checkout, and cleans up its worktree on both
  #     the passing and the failing path (item 4).
  # Reverted once proven - see the review reply for the run IDs this
  # produced.
  store-package-check:
    name: "TEMPORARY: store-package.ps1 (review 177 / handoff 085, F207)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target/store-build
          key: windows-store-package-check-${{ hashFiles('**/Cargo.lock') }}

      - name: PowerShell 5.1 refuses the wrong shell (item 1)
        shell: pwsh
        run: |
          $out = & powershell.exe -File ./packaging/windows/check-imports.ps1 -ExePath "does-not-exist.exe" 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "--- powershell.exe (Windows PowerShell 5.1) output ---"
          Write-Host $out
          Write-Host "exit code: $code"

          if ($code -eq 0) {
            Write-Error "Windows PowerShell 5.1 ran check-imports.ps1 to completion instead of refusing it"
            exit 1
          }
          if ($out -notmatch '(?i)requires\s+Windows\s+PowerShell\s+version\s+7\.0') {
            Write-Error "the failure did not look like a #Requires version refusal:`n$out"
            exit 1
          }
          if ($out -match 'does-not-exist\.exe') {
            Write-Error "the script's own body ran (it mentioned the ExePath argument) - #Requires did not stop it before execution:`n$out"
            exit 1
          }
          Write-Host "OK: Windows PowerShell 5.1 refused before running anything."

      - name: UTF-8 manifest read regression test (item 2)
        shell: pwsh
        run: |
          # Windows PowerShell 5.1's own default on a non-English system,
          # for a file with no BOM: the host's ANSI/OEM code page, not
          # UTF-8 (CP932 on Japanese Windows - F207's exact cause). Forced
          # here inside pwsh 7, which does not hit the bug itself, so this
          # step can compare the OLD read against the NEW one under the
          # same forced settings a 5.1 host would actually have.
          [Console]::OutputEncoding = [System.Text.Encoding]::GetEncoding(932)
          $PSDefaultParameterValues['*:Encoding'] = 'oem'

          $path = "./packaging/windows/AppxManifest.xml"
          $expectedDescription = ([xml](Get-Content -Raw -Encoding utf8 $path)).Package.Applications.Application.VisualElements.Description

          $oldReproduced = $false
          try {
            [xml]$old = Get-Content -Raw $path
            $oldDescription = $old.Package.Applications.Application.VisualElements.Description
            if ($oldDescription -ne $expectedDescription) {
              Write-Host "OLD method (Get-Content -Raw -> [xml]): parsed, but Description differs under forced OEM encoding - this is the regression:"
              Write-Host "  expected: $expectedDescription"
              Write-Host "  got:      $oldDescription"
              $oldReproduced = $true
            } else {
              Write-Host "OLD method: read the same Description even under forced OEM encoding."
            }
          } catch {
            Write-Host "OLD method (Get-Content -Raw -> [xml]): threw under forced OEM encoding: $($_.Exception.Message)"
            $oldReproduced = $true
          }

          $new = New-Object System.Xml.XmlDocument
          $new.Load($path)
          $newDescription = $new.Package.Applications.Application.VisualElements.Description
          if ($newDescription -ne $expectedDescription) {
            Write-Error "NEW method (XmlDocument.Load) did not read the correct Description either - the fix does not hold:`n$newDescription"
            exit 1
          }
          Write-Host "OK: NEW method (XmlDocument.Load) read the correct Description under forced OEM encoding."

          if (-not $oldReproduced) {
            Write-Host "::warning::could not reproduce the OLD method failing under this pwsh/runner combination - see the review reply for what this means for item 2."
          }

      - name: Make an uncommitted change, and tag HEAD locally (never pushed)
        id: setup
        shell: pwsh
        run: |
          "scratch - not committed, proves store-package.ps1 never touches this" |
            Out-File -FilePath "UNCOMMITTED-SCRATCH.txt" -Encoding utf8

          $version = (Select-String -Path "Cargo.toml" -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Write-Host "Tagging HEAD locally as $version (never pushed - version-sync and the release workflow both react to a real one)"
          git tag -f $version

          "tag=$version" >> $env:GITHUB_OUTPUT

      - name: Checkout state before store-package.ps1
        shell: pwsh
        run: |
          Write-Host "branch: $(git branch --show-current)"
          Write-Host "status:"
          git status --porcelain
          Write-Host "worktree list:"
          git worktree list

      - name: Run store-package.ps1
        id: run
        shell: pwsh
        continue-on-error: true
        run: |
          & pwsh -File ./packaging/windows/store-package.ps1 -Tag "${{ steps.setup.outputs.tag }}"
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit $LASTEXITCODE

      - name: Checkout state after store-package.ps1
        if: always()
        shell: pwsh
        run: |
          Write-Host "store-package.ps1 exit code: ${{ steps.run.outputs.exit_code }}"
          Write-Host "branch: $(git branch --show-current)"
          Write-Host "status:"
          git status --porcelain
          Write-Host "worktree list:"
          git worktree list
          Write-Host "output folder (target/store):"
          if (Test-Path "target/store") {
            Get-ChildItem -Recurse "target/store" | ForEach-Object { Write-Host "$($_.FullName): $($_.Length) bytes" }
          } else {
            Write-Host "(does not exist)"
          }

      - name: Fail the job if store-package.ps1 itself failed unexpectedly
        if: steps.run.outputs.exit_code != '0'
        shell: pwsh
        run: |
          Write-Error "store-package.ps1 exited ${{ steps.run.outputs.exit_code }} - see the two checkout-state steps and the run step's own log above"
          exit 1

      - name: A missing tag stops with the fetch message, and fetches nothing
        if: always()
        shell: pwsh
        run: |
          $badTag = "9.9.9-does-not-exist-${{ github.run_id }}"
          $out = & pwsh -File ./packaging/windows/store-package.ps1 -Tag $badTag 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          Write-Host "exit code: $code"

          if ($code -eq 0) {
            Write-Error "expected a non-zero exit for a tag that was never fetched"
            exit 1
          }
          if ($out -notmatch "git fetch --tags") {
            Write-Error "expected the 'Run git fetch --tags first' message:`n$out"
            exit 1
          }
          Write-Host "OK: missing tag stopped with the fetch message, exit $code."
