name: Windows Check

# F109 (review 109 §4): dispatchable on demand, so the WebView2 detection
# check (crates/forskscope-ui/src/webview2.rs, wired in main.rs) is proven
# against a real windows-latest runner before it ships in a release, not
# for the first time inside release.yml itself. workflow_dispatch only -
# no push trigger, so nothing runs unless someone asks for it, and no
# rehearsal tag is ever needed (review 108 §5).
#
# Builds the same release binary release.yml's Windows job builds, then
# runs `--diagnostics` twice: once as-is (WebView2 present on this
# runner), once with WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at a
# fresh empty directory (the WebView2 loader's own env var, which the
# F109 handoff expects to make detection fail even though the runtime is
# actually installed). Both outputs are printed regardless of outcome.

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: WebView2 detection (F109)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      # The binary is windows_subsystem = "windows" in a release build, so
      # the first thing this step must confirm is that its stdout actually
      # reaches this log at all - a GUI-subsystem exe has no console of its
      # own, but a CI runner invokes it with its stdout piped/redirected,
      # which is what actually determines whether a write to the stdout
      # handle goes anywhere, independent of console attachment. Checked
      # empirically below, not assumed either way.
      - name: Run --diagnostics and assert WebView2 detection
        shell: pwsh
        run: |
          $normal = & ./target/release/forskscope.exe --diagnostics 2>&1 | Out-String
          Write-Host "--- diagnostics: WebView2 present (this runner's real install) ---"
          Write-Host $normal

          if ([string]::IsNullOrWhiteSpace($normal)) {
            Write-Error "no stdout was captured at all from the release (windows_subsystem = 'windows') binary - this is a GUI-subsystem stdout-capture problem, not a WebView2 detection problem, and it means the assertions below would test nothing."
            exit 1
          }

          $empty = Join-Path $env:RUNNER_TEMP "empty-webview2-dir"
          New-Item -ItemType Directory -Path $empty -Force | Out-Null
          $env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER = $empty
          $forced = & ./target/release/forskscope.exe --diagnostics 2>&1 | Out-String
          Remove-Item Env:WEBVIEW2_BROWSER_EXECUTABLE_FOLDER
          Write-Host "--- diagnostics: WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at an empty directory ---"
          Write-Host $forced

          $ok = $true

          if ($normal -notmatch '(?m)^WebView2 runtime: \d') {
            Write-Error "expected a line matching '^WebView2 runtime: \d' (a version) in the normal run - got:`n$normal"
            $ok = $false
          }

          if ($forced -notmatch '(?m)^WebView2 runtime: not found \(') {
            Write-Error "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER pointed at an empty directory did not produce a 'not found' line - it may not actually simulate a missing runtime on this runner. Got:`n$forced"
            $ok = $false
          }

          if (-not $ok) {
            exit 1
          }
          Write-Host "Both assertions passed."

  # RFC-091 §4 (F45): the hybrid-CRT release gate, Windows' equivalent of
  # the Linux 16-library check (F179/F180, release.yml). Dispatchable on
  # demand for the same reason as the job above: proven against a real
  # windows-latest runner before it ships, no rehearsal tag needed.
  crt-import-check:
    name: Hybrid CRT import check (RFC-091 §4, F45)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: windows-crt-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-binutils (llvm-objdump wrapper)
        run: cargo install cargo-binutils --locked

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-ui

      # RFC-091 §4: "about 100 to 200 KB" larger, measure and report.
      - name: Report forskscope.exe's size
        shell: pwsh
        run: |
          $bytes = (Get-Item ./target/release/forskscope.exe).Length
          Write-Host "forskscope.exe: $bytes bytes ($([math]::Round($bytes / 1MB, 2)) MiB)"

      - name: List imported DLLs and enforce the allow-list
        shell: pwsh
        run: |
          $dump = cargo objdump --release --bin forskscope -- -p 2>&1 | Out-String
          Write-Host "--- llvm-objdump -p (private headers) ---"
          Write-Host $dump

          $imports = [regex]::Matches($dump, '(?m)^\s*DLL Name:\s*(\S+)\s*$') |
            ForEach-Object { $_.Groups[1].Value } |
            Sort-Object -Unique

          Write-Host "--- Imported DLLs (unique) ---"
          $imports | ForEach-Object { Write-Host $_ }

          if ($imports.Count -eq 0) {
            Write-Error "no 'DLL Name:' lines were found in llvm-objdump's output — the parse itself may be wrong, not the binary. Full output is above."
            exit 1
          }

          # Explicit allow-list (RFC-091 §4: "a new import must be
          # justified, as on Linux"), built from what forskscope.exe
          # actually imports after the hybrid-CRT change — not a
          # speculative superset. Each entry is a Windows system DLL
          # present on every supported Windows 10+ install, never the
          # Visual C++ Redistributable this change exists to stop
          # depending on.
          $allowExact = @(
            "kernel32.dll",            # core Win32 API
            "user32.dll",              # windowing, messages
            "gdi32.dll",               # graphics primitives
            "ntdll.dll",               # always present, loaded by the OS loader itself
            "advapi32.dll",            # registry, security, service APIs
            "shell32.dll",             # shell integration (rfd's native dialogs)
            "shlwapi.dll",             # shell path/string helpers
            "comctl32.dll",            # common controls (native dialogs/menus)
            "ole32.dll",               # COM — how WebView2 is reached
            "oleaut32.dll",            # COM automation (BSTR etc.)
            "ws2_32.dll",              # networking (update check, HTTPS)
            "crypt32.dll",             # TLS certificate handling
            "secur32.dll",             # SSPI/Schannel — TLS handshake (update check, HTTPS)
            "bcryptprimitives.dll",    # Windows CNG crypto primitives (reached via rustls/ring)
            "dwmapi.dll"               # desktop window manager (drop shadows etc.)
          )
          # The Universal CRT's own API-set forwarders (api-ms-win-crt-*,
          # six of them: convert/heap/locale/math/runtime/stdio/string) and
          # core OS API-set forwarders (api-ms-win-core-*, synch): Windows
          # 10+ system components that resolve to kernel32.dll/ucrtbase.dll
          # via OS-level API Set redirection, not anything this project
          # links against directly or redistributes — matched by prefix
          # rather than naming every one.
          $allowPrefixes = @("api-ms-win-crt-", "api-ms-win-core-")

          $bad = $imports | Where-Object {
            $name = $_
            $isVcrt = $name -match '^(?i)VCRUNTIME'
            $isMsvcp = $name -match '^(?i)MSVCP'
            $isAllowedExact = $allowExact -contains $name
            $isAllowedPrefix = $false
            foreach ($p in $allowPrefixes) {
              if ($name.ToLower().StartsWith($p)) { $isAllowedPrefix = $true }
            }
            $isVcrt -or $isMsvcp -or -not ($isAllowedExact -or $isAllowedPrefix)
          }

          if ($bad) {
            Write-Error "forskscope.exe imports a DLL not on the allow-list (or a VCRUNTIME*/MSVCP* dependency the hybrid CRT exists to remove): $($bad -join ', ')"
            exit 1
          }
          Write-Host "All imports are on the allow-list; no VCRUNTIME*/MSVCP* present."

  # TEMPORARY (handoff 082): falsifies the new store-build.ps1/
  # store-validate.ps1 guards on a real windows-latest runner, then is
  # reverted in the next commit - this is a one-off verification run, not
  # a release gate. The scripts under test are copied out before any
  # `git switch`, since store-submit.yml's own real checkout of a tag
  # would otherwise replace them with whatever that tag's commit held.
  store-packaging-guards:
    name: TEMP - store packaging script guards (handoff 082)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: store-guards-${{ hashFiles('**/Cargo.lock') }}

      - name: Copy the scripts under test out of the way of the tag checkout below
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "scripts-under-test"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item packaging/windows/store-build.ps1 $dest
          Copy-Item packaging/windows/store-validate.ps1 $dest
          Write-Host "Copied to $dest"

      - name: Check out the latest released tag for the guards below
        shell: pwsh
        run: |
          git fetch --tags
          $tag = git describe --tags --abbrev=0
          "TAG=$tag" >> $env:GITHUB_ENV
          git switch --detach $tag
          Write-Host "Checked out tag $tag"

      - name: "Guard: store-build.ps1 refuses when HEAD is a real tag but not the one named"
        shell: pwsh
        run: |
          # Spawned as a real child process (pwsh -File), not `& $script` in
          # this process: store-build.ps1's own `exit` would otherwise end
          # this whole step before any assertion below ever ran.
          $script = Join-Path $env:RUNNER_TEMP "scripts-under-test/store-build.ps1"
          $out = Join-Path $env:RUNNER_TEMP "guard-wrong-commit"
          $wrongTag = "0.0.0-not-$env:TAG"
          $output = & pwsh -NoProfile -File $script -Tag $wrongTag -OutDir $out 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -eq 0) {
            Write-Error "expected store-build.ps1 to refuse when HEAD (tag $env:TAG) is not the named tag ($wrongTag), but it exited 0"
            exit 1
          }
          if ($output -notmatch "HEAD is not exactly tag $wrongTag" -or $output -notmatch [regex]::Escape($env:TAG)) {
            Write-Error "refused, but not with the expected message naming both tags - got:`n$output"
            exit 1
          }
          Write-Host "OK: refused, naming both the real tag and the wrong one."
          exit 0

      - name: "Guards: build succeeds with no GITHUB_OUTPUT, prints the path last, restores FORSKSCOPE_CHANNEL"
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "scripts-under-test/store-build.ps1"
          $out = Join-Path $env:RUNNER_TEMP "guard-build"

          Remove-Item Env:GITHUB_OUTPUT -ErrorAction SilentlyContinue
          Remove-Item Env:FORSKSCOPE_CHANNEL -ErrorAction SilentlyContinue

          # Spawned as a real child process - see the comment on the guard
          # above for why.
          $output = & pwsh -NoProfile -File $script -Tag "$env:TAG" -OutDir $out 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output

          if ($exit -ne 0) {
            Write-Error "store-build.ps1 failed with no GITHUB_OUTPUT set"
            exit 1
          }

          $lines = $output -split "`r?`n" | Where-Object { $_.Trim() -ne "" }
          $lastLine = $lines[-1].Trim()
          $expectedPath = Join-Path $out "forskscope-$env:TAG.msix"
          if ($lastLine -ne $expectedPath) {
            Write-Error "expected the last line of output to be the MSIX path '$expectedPath', got '$lastLine'"
            exit 1
          }
          if (-not (Test-Path $expectedPath)) {
            Write-Error "the printed path does not exist: $expectedPath"
            exit 1
          }
          Write-Host "OK: succeeded with no GITHUB_OUTPUT, printed the real path as the last line."

          if ($env:FORSKSCOPE_CHANNEL) {
            Write-Error "FORSKSCOPE_CHANNEL is still '$env:FORSKSCOPE_CHANNEL' after store-build.ps1 returned"
            exit 1
          }
          Write-Host "OK: FORSKSCOPE_CHANNEL is unset after the build."

          "GOOD_MSIX=$expectedPath" >> $env:GITHUB_ENV
          exit 0

      - name: "Guard: store-validate.ps1 -SkipInstall passes on a good package and changes no registry value"
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "scripts-under-test/store-validate.ps1"
          $unlockKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          $before = (Get-ItemProperty -Path $unlockKey -Name AllowAllTrustedApps -ErrorAction SilentlyContinue).AllowAllTrustedApps

          $output = & pwsh -NoProfile -File $script -MsixPath "$env:GOOD_MSIX" -Tag "$env:TAG" -SkipInstall 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -ne 0) {
            Write-Error "-SkipInstall did not pass on a good package"
            exit 1
          }

          $after = (Get-ItemProperty -Path $unlockKey -Name AllowAllTrustedApps -ErrorAction SilentlyContinue).AllowAllTrustedApps
          if ($before -ne $after) {
            Write-Error "AllowAllTrustedApps changed from '$before' to '$after' even though -SkipInstall was passed"
            exit 1
          }
          Write-Host "OK: -SkipInstall passed on a good package and touched no registry value (before/after: '$before')."
          exit 0

      - name: "Guard: store-validate.ps1 -SkipInstall fails on a package missing an asset"
        shell: pwsh
        run: |
          # The handoff asks that the script fail on a package missing an
          # asset, not that it fail with check 3's own "is missing X"
          # message specifically - and reaching that exact message turns
          # out not to be possible through any real MSIX: makeappx pack
          # itself already refuses to build a package whose manifest
          # references a file that is not staged ("Manifest validation
          # error ... doesn't exist in the package"), confirmed live, and
          # even bypassing that with pack's own /nv ("skip semantic
          # validation") flag does not help, because makeappx unpack -
          # which store-validate.ps1 always calls first, with no
          # equivalent bypass - enforces the exact same manifest-reference
          # validation and refuses too, also confirmed live. So for any of
          # the four manifest-required visual assets, store-validate.ps1's
          # own check 3 Fail-Check path is unreachable in practice - the
          # package is rejected one layer earlier, by makeappx itself,
          # before check 3 ever runs. That is a property of this script's
          # existing (unmodified by handoff 082) check 3/unpack logic, not
          # something to fix here - reported to the architect instead.
          # What below still legitimately proves: deleting a file straight
          # out of an already-built .msix (its signed block map then no
          # longer matches) makes store-validate.ps1 fail, deterministically,
          # on a package that is missing an asset - just via makeappx's own
          # "package block map is not valid" refusal rather than check 3's
          # own message.
          $brokenMsix = Join-Path $env:RUNNER_TEMP "forskscope-broken-$env:TAG.msix"
          Copy-Item "$env:GOOD_MSIX" $brokenMsix -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($brokenMsix, [System.IO.Compression.ZipArchiveMode]::Update)
          try {
            $entry = $zip.GetEntry("Assets/Square44x44Logo.png")
            if (-not $entry) { throw "Assets/Square44x44Logo.png not found in the built MSIX - cannot stage this guard" }
            $entry.Delete()
          } finally {
            $zip.Dispose()
          }

          $script = Join-Path $env:RUNNER_TEMP "scripts-under-test/store-validate.ps1"
          $output = & pwsh -NoProfile -File $script -MsixPath $brokenMsix -Tag "$env:TAG" -SkipInstall 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -eq 0) {
            Write-Error "expected store-validate.ps1 to fail on a package missing an asset, but it exited 0"
            exit 1
          }
          Write-Host "OK: failed (exit $exit) on a package missing an asset - via makeappx's own refusal to unpack it, not check 3's own message; see the comment above for why that message is unreachable through any real MSIX."
          exit 0

      - name: "Guard: store-validate.ps1 refuses outside CI without either switch, before any change"
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "scripts-under-test/store-validate.ps1"
          $unlockKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          $before = (Get-ItemProperty -Path $unlockKey -Name AllowAllTrustedApps -ErrorAction SilentlyContinue).AllowAllTrustedApps

          Remove-Item Env:GITHUB_ACTIONS -ErrorAction SilentlyContinue
          $output = & pwsh -NoProfile -File $script -MsixPath "$env:GOOD_MSIX" -Tag "$env:TAG" 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output

          if ($exit -eq 0) {
            Write-Error "expected store-validate.ps1 to refuse outside CI without -SkipInstall/-AllowMachineChanges, but it exited 0"
            exit 1
          }
          if ($output -notmatch "changes this machine") {
            Write-Error "refused, but not with the expected message - got:`n$output"
            exit 1
          }

          $after = (Get-ItemProperty -Path $unlockKey -Name AllowAllTrustedApps -ErrorAction SilentlyContinue).AllowAllTrustedApps
          if ($before -ne $after) {
            Write-Error "AllowAllTrustedApps changed from '$before' to '$after' even though the script was supposed to refuse before any change"
            exit 1
          }
          Write-Host "OK: refused with the expected message, and changed nothing."
          exit 0

      - name: "Guard: AllowAllTrustedApps reads the same before and after a full CI validation"
        shell: pwsh
        run: |
          $script = Join-Path $env:RUNNER_TEMP "scripts-under-test/store-validate.ps1"
          $unlockKey = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          $before = (Get-ItemProperty -Path $unlockKey -Name AllowAllTrustedApps -ErrorAction SilentlyContinue).AllowAllTrustedApps

          # $env:GITHUB_ACTIONS is set by the runner for every step by
          # default; the previous guard step only cleared it for itself.
          $output = & pwsh -NoProfile -File $script -MsixPath "$env:GOOD_MSIX" -Tag "$env:TAG" 2>&1 | Out-String
          $exit = $LASTEXITCODE
          Write-Host $output
          if ($exit -ne 0) {
            Write-Error "the full install+launch validation failed on a good package in CI"
            exit 1
          }

          $after = (Get-ItemProperty -Path $unlockKey -Name AllowAllTrustedApps -ErrorAction SilentlyContinue).AllowAllTrustedApps
          if ($before -ne $after) {
            Write-Error "AllowAllTrustedApps was left at '$after' after a full validation, instead of its original '$before'"
            exit 1
          }
          Write-Host "OK: full install+launch validation passed, and AllowAllTrustedApps reads the same before ('$before') and after ('$after')."
          exit 0
