name: Linux Check (temporary rehearsal)

# Temporary: rehearses release.yml's new "forskscope-cli links only the C
# runtime" check (RFC-094 §1) on a real ubuntu-latest runner before it
# ships, the same reason windows-check.yml exists for the Windows side -
# no tag needed. Dispatched once, output quoted in the review request,
# then this file is removed; release.yml's own Linux job is the permanent
# home for this check going forward.

on:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: forskscope-cli links only the C runtime (RFC-094 §1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-check-temp-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --locked -p forskscope-cli

      - name: forskscope-cli links only the C runtime
        run: |
          EXPECTED="libgcc_s.so.1
          libc.so.6"
          ACTUAL=$(readelf -d target/release/forskscope-cli \
            | grep NEEDED \
            | sed -E 's/.*\[(.*)\]/\1/')
          echo "--- readelf -d NEEDED entries ---"
          echo "$ACTUAL"
          DIFF=$(diff <(echo "$EXPECTED" | sed 's/^ *//' | sort) <(echo "$ACTUAL" | sort)) || true
          if [ -n "$DIFF" ]; then
            echo "::error::target/release/forskscope-cli links more than the C runtime:"
            echo "$DIFF"
            exit 1
          fi
          INTERP=$(readelf -l target/release/forskscope-cli | grep -o '/lib64/ld-linux-x86-64.so.2')
          echo "--- ELF interpreter ---"
          echo "$INTERP"
          if [ -z "$INTERP" ]; then
            echo "::error::forskscope-cli's ELF interpreter is not /lib64/ld-linux-x86-64.so.2"
            exit 1
          fi
          echo "forskscope-cli links only libc/libgcc_s, interpreter $INTERP."
