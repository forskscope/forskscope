name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # F23: no workflow file was ever machine-parsed before this — release.yml
      # only triggers on tag push, so a syntax error there was invisible until
      # a real cut. Runs before the system-dependency install and Rust
      # toolchain setup so a bad workflow file is reported in seconds, not
      # after the slowest steps in the job.
      - name: Install actionlint
        run: |
          curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint_1.7.12_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      # F42: actionlint's shellcheck pass runs only if a `shellcheck` binary
      # is on PATH — absent, it silently skips the rule and exits 0, so
      # `release.yml`'s eleven `run:` blocks would stop being checked with
      # CI still green. `ubuntu-latest` ships shellcheck today; this step
      # exists so its removal is a loud CI failure instead of a silent
      # narrowing of what "Lint workflow files" actually covers.
      - name: Verify shellcheck is present (F42)
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error::shellcheck is not on PATH — actionlint's shellcheck pass would silently skip every run: block instead of checking them (F42)"
            exit 1
          fi
          shellcheck --version

      # No args: actionlint discovers every file under .github/workflows/
      # itself, so a third workflow added later is covered with no CI edit.
      # Its bundled shellcheck pass covers every `run:` block, including
      # release.yml's, without executing any of them.
      - name: Lint workflow files (actionlint)
        run: actionlint

      - name: Install system dependencies (WebKitGTK, GTK3)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo fmt
        run: cargo fmt --check

      # F18: xtask is not a workspace member (DEC-005 — it must build and run
      # standalone even if the main workspace's Cargo.toml is broken), so
      # `cargo fmt --check` above never sees it: it resolves formatting
      # targets from the nearest [workspace] table, and xtask/Cargo.toml
      # declares its own. Without this, xtask/src/main.rs drifts from current
      # rustfmt output silently — it already had, distorting the file's ELOC
      # figure against the 300/500-line thresholds (F13).
      - name: cargo fmt (xtask)
        run: cargo fmt --manifest-path xtask/Cargo.toml --check

      - name: CSS generated artifact check
        run: cargo xtask css --check

      - name: Version metadata sync check
        run: cargo xtask version-sync

      - name: i18n coverage check
        run: cargo xtask i18n

      - name: Security advisory audit
        run: cargo audit

      - name: Security dependency path check
        run: cargo xtask audit-deps

      - name: cargo test (headless release gate)
        run: cargo test -p forskscope-core -p forskscope-ui-logic

      - name: cargo clippy (headless release gate)
        run: cargo clippy -p forskscope-core -p forskscope-ui-logic -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

      # F41: the F38 permission-regression test asserts against a same-
      # directory fs::write's mode, which is correct, but can only *fail*
      # under a non-default umask — CI's own default (022) can't observe a
      # regression back to a hardcoded mode. 077 is what review 052's
      # mutation used. A dedicated step in its own shell is required rather
      # than an in-test `libc::umask` call: umask is process-global, and
      # `cargo test` runs every test as a thread in one process, so an
      # in-test change would race the other ~1090 tests.
      #
      # Filter: any test whose name contains "permissions" — today that's
      # persist_noclobber's F38 regression test, plus one unrelated
      # RecoveryHint-mapping test caught incidentally (harmless under any
      # umask). A future test asserting on a created file's mode must
      # include "permissions" in its name to be covered here automatically.
      # F42: `cargo test` exits 0 when a filter matches no tests at all (and
      # even `-- --exact <unknown-name>` exits 0), so a rename of the F38
      # regression test would silently turn this step into a no-op that
      # still reports success. `--list` first and grep for the exact test
      # path, so a rename fails loudly here instead of the umask coverage
      # quietly disappearing.
      - name: File permission tests under a non-default umask (F41)
        run: |
          umask 077
          if ! cargo test -p forskscope-core permissions -- --list 2>/dev/null \
              | grep -q '^tests::save_target_tests::persist_noclobber_output_is_not_left_with_tempfiles_narrow_default_permissions: test$'; then
            echo "::error::the \"permissions\" filter no longer matches persist_noclobber_output_is_not_left_with_tempfiles_narrow_default_permissions — F38's umask regression test is no longer covered by this step (F42)"
            exit 1
          fi
          cargo test -p forskscope-core permissions

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

      - name: cargo build (UI — ensures it compiles)
        run: cargo build -p forskscope-ui
