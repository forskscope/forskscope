name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (WebKitGTK, GTK3)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: cargo fmt
        run: cargo fmt --check

      - name: CSS generated artifact check
        run: cargo xtask css --check

      - name: Version metadata sync check
        run: cargo xtask version-sync

      - name: i18n coverage check
        run: cargo xtask i18n

      - name: Security advisory audit
        run: cargo audit

      - name: Security dependency path check
        run: cargo xtask audit-deps

      - name: cargo test (headless release gate)
        run: cargo test -p forskscope-core -p forskscope-ui-logic

      - name: cargo clippy (headless release gate)
        run: cargo clippy -p forskscope-core -p forskscope-ui-logic -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --workspace

      - name: cargo clippy (workspace)
        run: cargo clippy --workspace -- -D warnings

      - name: cargo build (UI — ensures it compiles)
        run: cargo build -p forskscope-ui
