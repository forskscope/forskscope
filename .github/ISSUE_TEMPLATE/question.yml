name: Question
description: Ask a usage or support question
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Please share enough context so others can understand your question quickly.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What do you want to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do, and what have you already tried?
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        Helpful whenever the answer depends on which build you have.
        In the app: **Settings** → the **ℹ** button (top-right of the dialog) →
        **Copy diagnostics**. From a terminal: `forskscope --diagnostics`.
      placeholder: "e.g. 0.173.0"
  - type: textarea
    id: logs
    attributes:
      label: Relevant commands / output
      description: Paste any relevant commands, error output, or screenshots as text.
      render: shell
