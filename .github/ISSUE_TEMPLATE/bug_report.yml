name: Bug report
description: Report a reproducible bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.
        Please fill out the fields below as completely as possible.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short and clear description of the problem.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps to reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        In the app: **Settings** → the **ℹ** button (top-right of the dialog) → **Copy diagnostics**.
        From a terminal: `forskscope --diagnostics` — it prints the version and your
        platform, with your home directory redacted so it is safe to paste here.
      placeholder: "e.g. 0.173.0"
  - type: dropdown
    id: install_source
    attributes:
      label: How did you install ForskScope?
      description: Builds from different sources can be at different versions.
      options:
        - Downloaded from the GitHub releases page
        - Microsoft Store
        - AUR (Arch Linux)
        - Built from source
        - Other / not sure
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Your operating system and version. The diagnostics above already include this —
        pasting them here is enough.
      placeholder: |
        Windows 11
        macOS 14 (Apple silicon)
        Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Terminal output, if you have any
      description: |
        Optional, and often empty — **ForskScope does not write a log file**, so there is
        nothing to look for on disk. If you happened to start it from a terminal, paste
        anything it printed there.
      render: shell
